# Curated test corpus. Phone numbers are generated by build_corpus.py.
# "control" = Anglo-American / US inputs that any working validator should accept.

sources:
  W3C_NAMES: "W3C Internationalization. Personal names around the world. https://www.w3.org/International/questions/qa-personal-names"
  MCKENZIE: "McKenzie, P. Falsehoods Programmers Believe About Names (2010). https://www.kalzumeus.com/2010/06/17/falsehoods-programmers-believe-about-names/"
  UPU: "Universal Postal Union. Postal addressing systems in member countries. https://www.upu.int/"
  NATIONAL_POST: "Format as published by the national postal operator of the country indicated"
  AUTHORS: "Constructed by the authors from common naming/addressing practice"

valid:
  full_name:
    control:
      source: AUTHORS
      values: ["John Smith", "Mary Johnson", "Robert Brown", "Emily Davis"]
    diacritics:
      source: W3C_NAMES
      values: ["José García", "Zoë Müller", "François Lefèvre", "Björn Ångström", "Łukasz Wiśniewski", "Nguyễn Văn An"]
    enye:
      source: AUTHORS
      values: ["Íñigo Muñoz", "Begoña Núñez"]
    two_surnames:
      source: W3C_NAMES
      values: ["María José Núñez Rodríguez", "Ana Lucía Pérez Ortega", "Carlos Andrés Gómez Salazar"]
    hyphen:
      source: MCKENZIE
      values: ["Anne-Marie Dupont", "Sarah Smith-Jones", "María José Núñez-O'Connor"]
    apostrophe:
      source: MCKENZIE
      values: ["Siobhán O'Connor", "Liam O'Brien", "D'Angelo Russo"]
    lowercase_particle:
      source: W3C_NAMES
      values: ["Pieter van der Berg", "Juan de la Cruz", "João dos Santos"]
    single_name:
      source: W3C_NAMES
      note: "Mononyms are common in e.g. Indonesia and Myanmar"
      values: ["Budiman", "Wulandari"]
    short_parts:
      source: W3C_NAMES
      values: ["Li Na", "Ng Ka Wai", "O Yu-jin"]
    long:
      source: MCKENZIE
      values: ["Pablo Diego José Francisco de Paula Juan Nepomuceno María de los Remedios Cipriano de la Santísima Trinidad Ruiz y Picasso", "Hubert Blaine Wolfeschlegelsteinhausenbergerdorff"]
    initials_suffix:
      source: MCKENZIE
      values: ["J. R. R. Tolkien", "Martin Luther King Jr."]
    non_latin:
      source: W3C_NAMES
      values: ["王伟", "山田太郎", "김민준", "Иван Петров", "محمد أحمد", "राहुल शर्मा", "Γιώργος Παπαδόπουλος", "דוד כהן", "สมชาย ใจดี"]

  given_name:
    control:
      source: AUTHORS
      values: ["John", "Mary", "Emily", "Robert"]
    diacritics:
      source: W3C_NAMES
      values: ["José", "Zoë", "Siân", "Łukasz", "Björn", "François"]
    enye:
      source: AUTHORS
      values: ["Íñigo", "Begoña"]
    compound:
      source: W3C_NAMES
      values: ["María José", "Juan Pablo", "Anne-Marie", "Jean-Luc"]
    apostrophe:
      source: MCKENZIE
      values: ["D'Angelo", "N'Golo"]
    short:
      source: MCKENZIE
      values: ["Bo", "Al", "Yu"]
    non_latin:
      source: W3C_NAMES
      values: ["伟", "太郎", "민준", "Иван", "محمد", "राहुल", "Γιώργος", "דוד", "สมชาย"]

  family_name:
    control:
      source: AUTHORS
      values: ["Smith", "Johnson", "Brown", "Davis"]
    diacritics:
      source: W3C_NAMES
      values: ["Müller", "Lefèvre", "Ångström", "Wiśniewski", "Nguyễn"]
    enye:
      source: AUTHORS
      values: ["Muñoz", "Núñez", "Peña"]
    two_surnames:
      source: W3C_NAMES
      values: ["Núñez Rodríguez", "Pérez Ortega", "Gómez Salazar"]
    hyphen:
      source: MCKENZIE
      values: ["Smith-Jones", "Núñez-O'Connor"]
    apostrophe:
      source: MCKENZIE
      values: ["O'Connor", "O'Brien", "D'Amico"]
    lowercase_particle:
      source: W3C_NAMES
      values: ["van der Berg", "de la Cruz", "dos Santos", "da Silva"]
    short:
      source: W3C_NAMES
      note: "O is a Korean surname (오); Li, Ng, Wu are common Chinese surnames"
      values: ["Li", "Ng", "Wu", "O"]
    long:
      source: MCKENZIE
      values: ["Wolfeschlegelsteinhausenbergerdorff"]
    non_latin:
      source: W3C_NAMES
      values: ["王", "山田", "김", "Петров", "أحمد", "शर्मा", "Παπαδόπουλος", "כהן", "ใจดี"]

  postal_code:
    control:
      source: NATIONAL_POST
      note: "United States ZIP codes"
      values: ["20500", "10001", "90210"]
    us_zip_plus4:
      source: NATIONAL_POST
      values: ["20500-0003"]
    alphanumeric:
      source: NATIONAL_POST
      note: "UK, UK, Canada, Netherlands, Ireland (Eircode), Argentina (CPA)"
      verify: true
      values: ["SW1A 1AA", "EC1A 1BB", "K1A 0B1", "1012 JS", "D02 X285", "C1002AAP"]
    hyphenated_non_us:
      source: NATIONAL_POST
      note: "Brazil, Japan, Portugal, Poland"
      verify: true
      values: ["01310-100", "100-0001", "1000-001", "00-950"]
    internal_space_digits:
      source: NATIONAL_POST
      note: "Sweden, Czechia, Greece"
      verify: true
      values: ["111 20", "110 00", "105 57"]
    four_digit:
      source: NATIONAL_POST
      note: "Australia, Switzerland, Denmark, Norway (leading zero)"
      verify: true
      values: ["2000", "8001", "1050", "0150"]
    six_digit:
      source: NATIONAL_POST
      note: "Ecuador, India, China, Russia, Colombia"
      verify: true
      values: ["170150", "110001", "100000", "101000", "110111"]
    three_digit:
      source: NATIONAL_POST
      note: "Iceland"
      verify: true
      values: ["101"]
    five_digit_non_us:
      source: NATIONAL_POST
      note: "Germany, Mexico (leading zero), Spain, France, Italy (leading zeros)"
      verify: true
      values: ["10115", "06000", "28013", "75001", "00184"]

  address_line:
    control:
      source: AUTHORS
      values: ["1600 Pennsylvania Avenue NW", "350 Fifth Avenue", "100 Main Street"]
    number_after_street:
      source: UPU
      values: ["Unter den Linden 77", "Rue de Rivoli 99", "Via del Corso 12"]
    non_ascii_latin:
      source: UPU
      values: ["Königstraße 1", "Avenida São João, 439", "Calle Núñez de Balboa 20", "Straße des 17. Juni 135"]
    special_symbols:
      source: UPU
      note: "Colombia (#), Latin American 'No.', Quito (N24-155 y ...), flat numbering"
      values: ["Carrera 7 # 32-16", "Calle 50 No. 20-30", "Av. 10 de Agosto N24-155 y Luis Cordero", "Flat 3/2, 15 Main Street", "Apt. 4B, 12 Oak St."]
    no_number:
      source: UPU
      values: ["Calle Principal s/n", "Rua sem nome, s/n", "Km 5 vía a la Costa"]
    reference_based:
      source: UPU
      note: "Directions-based addresses, e.g. Costa Rica, Nicaragua"
      values: ["200 metros al norte de la iglesia católica", "Frente al parque central"]
    block_numbering:
      source: UPU
      note: "Japanese chome-ban-go numbering, romanised"
      values: ["1-1 Chiyoda", "3-2-1 Nishi-Shinjuku"]
    non_latin:
      source: UPU
      values: ["景山前街4号", "千代田1-1", "Красная площадь, 1", "세종대로 209", "شارع التحرير 10"]

# Invalid inputs, per field group.
invalid:
  names:          # full_name, given_name, family_name
    source: AUTHORS
    values: ["", "   ", "\t\n", "12345", "!!!@@@###", "<script>alert(1)</script>", "\u0000\u0001", "😀😀😀"]
  phone_number:
    source: AUTHORS
    values: ["", "   ", "abc", "12", "123456789012345678901", "<script>alert(1)</script>", "phone"]
  postal_code:
    source: AUTHORS
    values: ["", "   ", "!!!!!", "<script>alert(1)</script>", "ABCDEFGHIJKLMNOPQRST", "12345678901234567890"]
  address_line:
    source: AUTHORS
    values: ["", "   ", "\t\n", "!!!@@@###", "<script>alert(1)</script>", "\u0000\u0001"]
